services:
  postgres:
    image: postgres:16-alpine
    container_name: jobboard-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./services/auth-service/migrations:/schemas/auth:ro
      - ./services/applicant-service/migrations:/schemas/applicant:ro
      - ./services/employer-service/migrations:/schemas/employer:ro
      - ./services/vacancy-service/migrations:/schemas/vacancy:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: jobboard-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./services/auth-service
    container_name: jobboard-auth
    environment:
      HTTP_PORT: "8081"
      DATABASE_URL: postgres://auth:auth@postgres:5432/auth_db?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRE_HOURS: "24"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  applicant-service:
    build: ./services/applicant-service
    container_name: jobboard-applicant
    environment:
      HTTP_PORT: "8082"
      DATABASE_URL: postgres://applicant:applicant@postgres:5432/applicant_db?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  employer-service:
    build: ./services/employer-service
    container_name: jobboard-employer
    environment:
      HTTP_PORT: "8083"
      DATABASE_URL: postgres://employer:employer@postgres:5432/employer_db?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  vacancy-service:
    build: ./services/vacancy-service
    container_name: jobboard-vacancy
    environment:
      HTTP_PORT: "8084"
      DATABASE_URL: postgres://vacancy:vacancy@postgres:5432/vacancy_db?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      EMPLOYER_SERVICE_URL: http://employer-service:8083
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      employer-service:
        condition: service_started

volumes:
  postgres_data:

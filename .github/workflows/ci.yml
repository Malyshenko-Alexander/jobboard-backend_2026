name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build Go services
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - applicant-service
          - employer-service
          - vacancy-service

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build -o /tmp/${{ matrix.service }} ./cmd/server
